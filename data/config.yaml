# =====================================================================
# Radar notizie — configurazione
#
# Il problema di questo sistema non e' raccogliere: e' decidere cosa NON
# mandarti. Fra calendario, trimestrali e testate arrivano centinaia di
# voci al giorno. Un bot che le notifica tutte viene silenziato in due
# giorni, e a quel punto non serve piu' a niente.
#
# Ogni soglia qui sotto esiste per tenere basso il numero di interruzioni.
# Se ricevi troppi avvisi, alza le soglie invece di sopportarli.
# =====================================================================

# RITMO — e' qui che si decide quanto ti arriva in ritardo una notizia.
#
# Il ritardo medio e' meta' dell'intervallo: con un giro ogni 10 minuti una
# notizia ti raggiunge in media dopo 5. Per questo i giri sono due.
#
# VELOCE: testate, banche centrali e calendario economico di oggi. Sono ~9
#   richieste, una quindicina di secondi. Il calendario di oggi e' la fonte
#   in cui compare il valore effettivo di un dato appena uscito: e' li' che
#   i minuti contano davvero.
# COMPLETO: aggiunge il calendario di domani, le 363 trimestrali e i 100
#   depositi SEC. Sono elenchi che si muovono di ore: interrogarli ogni tre
#   minuti sarebbe traffico sprecato verso servizi gratuiti che ci ospitano
#   per cortesia.
ritmo:
  veloce_minuti: 3
  completo_minuti: 20

pausa_fra_fonti_secondi: 1.5    # rispetta i limiti dei flussi gratuiti
memoria_giorni: 7               # per quanto si ricorda una voce gia' vista

# ETA' MASSIMA DI UNA VOCE, in ore. Vale solo per i flussi RSS.
#
# Serve perche' i feed non sono code di novita': sono archivi scorrevoli.
# Misurato il 16/08/2026 su un giro reale: 86 voci su 150 fra testate,
# banche centrali e forum avevano piu' di 36 ore, e la piu' vecchia era del
# 13/05/2024 — due anni prima. Senza questo taglio, meta' di cio' che il
# radar mostra e' roba archiviata.
#
# Il caso peggiore erano BCE e Federal Reserve: pubblicano l'intero archivio
# dei comunicati, quindi TUTTI risultavano presenti a ogni lettura. Una
# decisione di politica monetaria di settimane prima veniva letta come
# appena uscita, e poteva far scattare un avviso.
#
# PERCHE' 72 E NON 24. Nel fine settimana le testate finanziarie si
# fermano: misurato di domenica, l'articolo CNBC piu' recente aveva 66 ore
# e il comunicato BCE piu' recente 70 — sono le notizie di venerdi', ed
# erano le piu' fresche esistenti. Con un taglio a 24 o 36 ore la pagina
# si sarebbe svuotata ogni weekend.
#
# Il numero non e' arbitrario: fra la notizia piu' recente e l'archivio
# c'e' un salto netto. Sullo stesso giro, dopo le 70 ore si passava a 84,
# 119, 215, 407. Settantadue cade dentro quel vuoto.
#
# Non tocca il calendario (le sue date sono appuntamenti futuri) ne' i
# depositi SEC (arrivano gia' solo se recenti). Se un flusso non dichiara
# la data, la voce passa: meglio tenere l'incerto che buttare il vero.
eta_massima_ore: 72

# Richiesto dalla SEC per accedere a EDGAR: nome e contatto reali.
# Senza, EDGAR risponde 403 e viene saltato.
contatto_sec: "Radar Notizie Personale liguoriedo@gmail.com"

# ---------------------------------------------------------------------
# FONTI
# Verificate sul campo il 13/08/2026. Reuters (301) e BLS (403) sono
# escluse perche' non raggiungibili, non per scelta editoriale.
# ---------------------------------------------------------------------
feed:
  - nome: "CNBC"
    url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=20910258"
    tipo: notizia
    attivo: true

  - nome: "MarketWatch"
    url: "https://feeds.content.dowjones.io/public/rss/mw_topstories"
    tipo: notizia
    attivo: true

  - nome: "Yahoo Finance"
    url: "https://finance.yahoo.com/news/rssindex"
    tipo: notizia
    attivo: true

  - nome: "Investing.com"
    url: "https://www.investing.com/rss/news.rss"
    tipo: notizia
    attivo: true

  # Fonti primarie: nessun intermediario, nessuna interpretazione.
  # Quando la BCE o la Fed pubblicano, questa e' la notizia, non il commento.
  - nome: "BCE"
    url: "https://www.ecb.europa.eu/rss/press.html"
    tipo: ufficiale
    attivo: true

  - nome: "Federal Reserve"
    url: "https://www.federalreserve.gov/feeds/press_all.xml"
    tipo: ufficiale
    attivo: true

  # I DISCORSI dei banchieri centrali. Rarissimi — misurato, l'ultimo
  # risaliva a dieci giorni prima — e proprio per questo preziosi: volume
  # basso vuol dire rumore zero, e quando Powell testimonia al Congresso
  # quello e' l'evento della settimana.
  - nome: "Fed discorsi"
    url: "https://www.federalreserve.gov/feeds/speeches.xml"
    tipo: ufficiale
    attivo: true
    max_voci: 15

  - nome: "Fed testimonianze"
    url: "https://www.federalreserve.gov/feeds/testimony.xml"
    tipo: ufficiale
    attivo: true
    max_voci: 15

  # Notizie di mercato sostanziose: nel campione provato dava cose come
  # "Jane Street lost $15B in July" e lo stallo con l'Iran sul greggio.
  - nome: "Seeking Alpha"
    url: "https://seekingalpha.com/market_currents.xml"
    tipo: notizia
    attivo: true
    max_voci: 25

  # Scorte petrolifere e note sull'energia. Settimanale, ma quando esce
  # muove il greggio e a cascata l'inflazione attesa.
  - nome: "EIA energia"
    url: "https://www.eia.gov/rss/todayinenergy.xml"
    tipo: ufficiale
    attivo: true
    max_voci: 15
    veloce: false

  # SCARTATE dopo averle provate il 16/08/2026, e la ragione conta:
  #   Reuters (401), AP (403), BLS (403), Benzinga (403) — ci bloccano.
  #   WSJ — dichiara articoli di un anno e mezzo fa: date inutilizzabili.
  #   Nasdaq notizie — la piu' fresca di tutte (zero ore!) ma e' syndication
  #     da Motley Fool: "These 5 AI Stocks Have Returned 300%-Plus".
  #     Aggiungerla annullerebbe il lavoro fatto sul filtro.
  #   FT companies — giornalismo vero, ma su singole aziende europee:
  #     fuori dall'ambito macro che ti interessa.

  # I forum sono i piu' rapidi sulle notizie improvvise e i piu' rumorosi
  # su tutto il resto. Restano a punteggio basso: servono a confermare,
  # non a innescare.
  - nome: "Reddit r/stocks"
    url: "https://www.reddit.com/r/stocks/new/.rss"
    tipo: forum
    attivo: true
    max_voci: 25
    veloce: false               # non innesca mai avvisi: inutile interrogarlo spesso

calendario:
  attivo: true
  giorni_avanti: 2              # oggi e domani, per il preavviso

edgar:
  attivo: true
  moduli: ["8-K"]               # eventi rilevanti comunicati dalle societa'

# ---------------------------------------------------------------------
# CHE COSA MERITA UN'INTERRUZIONE
#
# Un avviso immediato costa la tua attenzione. Deve valerla.
# ---------------------------------------------------------------------
avvisi:
  # Un dato macro conta solo se si DISCOSTA dalle attese: il valore atteso
  # e' gia' nei prezzi. Qui si misura lo scarto in percentuale del valore
  # atteso; sotto questa soglia il dato e' "in linea" e non interrompe.
  sorpresa_minima_pct: 15

  # La percentuale da sola inganna sui numeri piccoli: un indicatore che
  # passa da 0,2 a 0,3 e' "+50%", ma 0,1 e' il minimo scarto rappresentabile
  # in un dato pubblicato con un decimale — un solo scatto, cioe' rumore.
  # Qui si chiede che la differenza valga almeno due scatti oltre alla
  # percentuale. E' la regola che tiene fuori la stima giornaliera del
  # Cleveland CPI e fa passare i sussidi di disoccupazione (202K -> 209K,
  # settemila scatti).
  scatti_minimi: 2

  # Eventi che contano indipendentemente dal numero, perche' e' la decisione
  # stessa a muovere i mercati. Confronto sul titolo, senza distinzione fra
  # maiuscole e minuscole.
  eventi_sempre:
    - "interest rate"
    - "fomc"
    - "federal funds"
    - "nonfarm payroll"
    - "unemployment rate"
    - "cpi"
    - "consumer price"
    - "ppi"
    - "gdp"
    - "retail sales"
    - "jobless claims"

  # Solo questi paesi generano avvisi immediati. Il calendario Nasdaq copre
  # decine di paesi: senza questo filtro arriverebbero avvisi sull'indice
  # dei prezzi neozelandese.
  paesi: ["United States", "Euro", "Germany", "Italy", "United Kingdom", "China"]

  # Le parole sono su due livelli, e la differenza conta.
  #
  # FORTI: una sola basta a farti interrompere. Sono i termini che quando
  # compaiono in un titolo la notizia e' quasi sempre quella vera.
  parole_forti:
    - "powell"
    - "lagarde"
    - "fomc"
    - "rate cut"
    - "rate hike"
    - "taglio dei tassi"
    - "monetary policy"
    - "emergency meeting"
    - "circuit breaker"
    # Un annuncio sui dazi muove i mercati come una decisione sui tassi, e
    # stava fra le parole deboli: da sola non bastava, quindi "la Casa Bianca
    # annuncia dazi su tutte le importazioni cinesi" finiva in fondo alla
    # pagina. Misurata sui dati veri, "tariff" compare in 3 voci su 680: e'
    # rara abbastanza da poter innescare da sola.
    - "tariff"
    # Stessa natura, ma non misurate: nel campione del 13/08 non comparivano
    # mai. Sono qui perche' quando compaiono non sono mai ordinaria
    # amministrazione. Se dovessero rivelarsi rumorose, spostale fra le
    # parole rilevanti.
    - "sanctions"
    - "export ban"

  # IL SOTTOINSIEME CHE VALE ANCHE SU UN GIORNALE.
  #
  # Le parole qui sopra bastano a far scattare un avviso quando arrivano da
  # una fonte primaria — la Fed che scrive "monetary policy" sta decidendo.
  # Da una testata la stessa parola e' quasi sempre un commento: misurato
  # sul campo, "rate hike" ha prodotto 23 avvisi in un giorno, tutti dentro
  # frasi come "rate hike odds fall" o "reduction in rate hike bets", cioe'
  # previsioni su un fatto che non e' successo.
  #
  # Queste invece, in un titolo, indicano un fatto avvenuto. Sono poche di
  # proposito: ogni aggiunta e' un potenziale ritorno del rumore.
  parole_da_testata:
    - "powell"
    - "lagarde"
    - "fomc"
    - "emergency meeting"
    - "circuit breaker"
    - "tariff"
    - "sanctions"
    - "export ban"

  # RILEVANTI: da sole non bastano. "nasdaq" compare in un titolo su tre e
  # "fed" in mezzo giornale: se una parola qui dentro innescasse un avviso,
  # il telefono suonerebbe tutto il giorno. Ne servono due distinte.
  parole_chiave:
    - "fed"
    - "bce"
    - "ecb"
    - "inflation"
    - "inflazione"
    - "recession"
    - "s&p 500"
    - "nasdaq"
    - "treasury"
    - "yield"
    - "jobs report"

  # Strumenti e societa' che segui. Una notizia o un deposito che li nomina
  # passa comunque, anche senza parole chiave.
  watchlist: ["SPY", "QQQ", "NVDA"]

  # I ticker si cercano rispettando le maiuscole — "SPY" e' un fondo, "spy"
  # e' una spia — ma nessun giornalista scrive "NVDA" nel titolo: scrive
  # "Nvidia". Qui si dice a che nomi corrisponde ogni simbolo.
  # Solo NOMI DI SOCIETA'. Gli alias degli indici sono stati tolti dopo la
  # prima giornata di funzionamento vero: "SPY -> s&p 500" faceva scattare
  # la watchlist su ogni cronaca di borsa, perche' "S&P 500" e' la locuzione
  # piu' comune del giornalismo finanziario. Da sola ha prodotto 63 avvisi
  # in ventiquattr'ore, nessuno dei quali diceva qualcosa sulle posizioni.
  #
  # I ticker SPY e QQQ restano nella watchlist: si cercano in maiuscolo, e
  # in quella forma nei titoli non compaiono quasi mai. E' il nome esteso a
  # essere rumore, non il simbolo.
  alias:
    NVDA: ["nvidia"]

  # Parole che, sul canale di chi le pubblica, non distinguono nulla: ogni
  # comunicato della BCE contiene "ECB", compreso l'invito al concerto
  # all'aperto. Su quella fonte la parola viene ignorata; altrove (in un
  # titolo di giornale, per esempio) continua a valere.
  parole_proprie:
    BCE: ["ecb", "bce"]
    Federal Reserve: ["fed", "federal reserve"]

  # Parole che tolgono a una voce il diritto di interromperti, anche quando
  # contiene tutte le parole giuste. Le banche centrali pubblicano nomine,
  # convegni e inviti sullo stesso canale delle decisioni: "la Fed annuncia i
  # responsabili della sua task force" contiene "monetary policy" e non muove
  # un prezzo. La voce resta sul dashboard, non ti arriva sul telefono.
  #
  # Nota: "conference" NON e' in questa lista, e volutamente — la conferenza
  # stampa di Powell dopo il FOMC e' uno degli eventi piu' importanti.
  parole_veto:
    - "task force"
    - "symposium"
    - "workshop"
    - "invite"
    - "appoint"
    - "award"
    - "anniversary"
    - "exhibition"
    - "vacancy"
    - "obituary"
    # Il riepilogo di giornata che Yahoo e simili aggiornano di continuo.
    # Contiene sempre "S&P 500", "Nasdaq" e "inflation", quindi supera ogni
    # regola, ma e' una cronaca: quando arriva, quello che dice lo sai gia'.
    - "stock market today"

  # ORE DI SILENZIO
  # Di notte gli avvisi non vengono mandati: restano nell'archivio e li
  # trovi nella panoramica delle 07:30, segnalati come arrivati nella notte.
  # Non e' un invio muto — un messaggio silenzioso lascia comunque la
  # notifica sulla schermata di blocco, che e' cio' che si vuole evitare.
  silenzio:
    attivo: true
    da: "23:00"
    a: "07:00"
    fuso: "Europe/Rome"

    # Di notte non vale un divieto ma una soglia piu' alta: passano solo le
    # fonti primarie delle banche centrali, dove la pubblicazione stessa e'
    # la decisione. Quelle suonano davvero — se ti svegliano deve valerne la
    # pena. Tutto il resto non viene inviato mai: resta sul dashboard in
    # rosso, con scritto "non inviato: ore di silenzio", e viene raccontato
    # nel riassunto delle 07:30.
    #
    # Per far passare anche i dati macro di prima grandezza, aggiungi
    # "evento" all'elenco. Attenzione: il calendario asiatico pubblica in
    # piena notte europea.
    passano_di_notte: ["ufficiale"]

  # Tetto rigido di interruzioni per ciclo (un ciclo = 10 minuti). Gli avvisi
  # in eccesso non spariscono: scendono sul dashboard. Serve a limitare il
  # danno se una fonte cambia formato e comincia a produrre spazzatura.
  max_avvisi_per_ciclo: 5

  # Solo i depositi di societa' abbastanza grandi da muovere il mercato:
  # di 8-K ne vengono depositati centinaia al giorno.
  solo_watchlist_per_depositi: true

# ---------------------------------------------------------------------
# PANORAMICA DEL MATTINO
# ---------------------------------------------------------------------
panoramica:
  ora: "07:30"                  # ora italiana
  fuso: "Europe/Rome"
  max_voci: 40                  # quante voci passare al riassunto

  # Con una chiave Anthropic la panoramica e' un discorso di dieci righe.
  # Senza, resta un elenco raggruppato e ordinato per importanza: meno
  # piacevole da leggere, identico nei contenuti, e a costo zero.
  riassunto_ia: true
  modello: "claude-haiku-4-5"

# ---------------------------------------------------------------------
# DASHBOARD
# ---------------------------------------------------------------------
# ---------------------------------------------------------------------
# MONITOR DEI PREZZI
#
# L'unico pezzo che guarda i mercati e non i giornali. Fino alla V1.6 il
# radar sapeva solo cosa SCRIVEVANO le testate: non poteva dirti che l'oro
# si era mosso del 2%.
#
# La fonte e' api.nasdaq.com, lo stesso host del calendario economico:
# nessuna chiave, nessun credito. Provata contro Twelve Data il
# 16/08/2026, i prezzi coincidono al centesimo.
#
# LIMITE DICHIARATO: le quotazioni sono DIFFERITE di circa un quarto
# d'ora. Non e' uno strumento per entrare su un movimento mentre accade —
# serve a sapere che qualcosa si e' mosso e a metterlo accanto alle
# notizie di quella mezz'ora.
# ---------------------------------------------------------------------
prezzi:
  attivo: true
  ogni_minuti: 5          # piu' fitto del ciclo notizie non avrebbe senso
  soglia_pct: 1.5         # sotto questa variazione non e' una notizia

  # Gli avvisi vanno a fasce: superato l'1,5% parte un avviso, poi silenzio
  # fino al 3%, poi fino al 4,5%. Senza, un titolo fermo a -1,6% per tre ore
  # manderebbe un avviso ogni cinque minuti.

  # A mercato chiuso il prezzo e' fermo da giorni: segnalarlo sarebbe
  # rumore. Lo stato del mercato lo dichiara la fonte stessa, ed e' piu'
  # solido che dedurlo da un orologio e da un calendario di festivita'.
  anche_a_mercato_chiuso: false

  simboli:
    - {simbolo: "SPY",  classe: "etf",    nome: "S&P 500"}
    - {simbolo: "QQQ",  classe: "etf",    nome: "Nasdaq 100"}
    - {simbolo: "NVDA", classe: "stocks", nome: "Nvidia"}
    # L'oro come future (GC:CMX) risponde ma senza dati. GLD e' l'ETF sul
    # metallo fisico: e' la strada che funziona.
    - {simbolo: "GLD",  classe: "etf",    nome: "Oro (GLD)"}

dashboard:
  # Il livello intermedio e' stato tolto in V1.4: restava una soglia su un
  # punteggio che misura il tipo di fonte, non l'importanza. Due livelli.

  # Dopo quanti minuti dalla generazione la pagina va considerata "in
  # ritardo". Il giro veloce e' ogni 3 minuti e il battito ripubblica ogni
  # 30 al massimo: 45 lascia margine per un ritardo di GitHub Pages senza
  # far scattare falsi allarmi. Oltre il quadruplo (3 ore) diventa "non
  # aggiornato", cioe' probabilmente il radar e' fermo.
  minuti_prima_di_ritardo: 45

# ---------------------------------------------------------------------
# PUBBLICAZIONE SU GITHUB PAGES
#
# Il NAS esegue e spinge la pagina su GitHub, che si limita a servirla.
# Gli avvisi Telegram NON passano di qui: partono dal NAS direttamente,
# quindi se GitHub e' lento o non risponde continuano ad arrivare puntuali.
#
# Serve GITHUB_TOKEN nel file .env — un "fine-grained token" ristretto a
# questo solo repository, con il permesso "Contents: Read and write" e
# nient'altro.
# ---------------------------------------------------------------------
pubblicazione:
  # ATTENZIONE: questo file e' la fonte, non una copia. Gli script di
  # aggiornamento lo incorporano cosi' com'e': se qui resta "false", la
  # pubblicazione viene spenta sul NAS al primo aggiornamento, in silenzio
  # e senza errori — perche' spegnerla di proposito e' legittimo, e il
  # programma non puo' distinguere la scelta dalla dimenticanza.
  attiva: true
  repo: "liguoriedo-cmd/news-radar"
  ramo: "main"
  cartella_remota: "docs"       # GitHub Pages e' configurato per servire /docs

  # Solo la pagina. dati.json pesa il doppio e non lo guarda nessuno da
  # browser: ogni pubblicazione e' un commit che resta li' per sempre.
  file: ["index.html"]

  # Ogni quanto ripubblicare comunque, anche a contenuto invariato. Senza,
  # in una notte tranquilla la pagina online resterebbe ferma per ore e il
  # segnalatore in cima direbbe "non aggiornato" pur essendo il radar vivo.
  # A 30 minuti il costo massimo e' 48 commit al giorno.
  battito_minuti: 30

  # Dopo quanti fallimenti consecutivi avvisare su Telegram. Solo per
  # GitHub: se a rompersi e' Telegram, annunciarlo via Telegram non
  # servirebbe a niente — quel caso lo segnala il dashboard.
  allarme_dopo: 3

  # IL RIEPILOGO IN CIMA ALLA PAGINA
  #
  # Non c'e' niente da regolare, ed e' voluto: il riepilogo e' esattamente
  # la panoramica delle 07:30 che arriva su Telegram, lo stesso identico
  # testo. UNA chiamata al modello al giorno, ~0,4 centesimi, cioe' circa
  # 12 centesimi al mese.
  #
  # Durante il giorno il riepilogo resta quello del mattino e invecchia: e'
  # il compromesso giusto, perche' quello che succede nel frattempo lo
  # trovi comunque sotto, negli avvisi e nelle voci in evidenza — che sono
  # gratis, immediati e non passano da nessuna parafrasi.
  #
  # L'unica eccezione e' il giorno dell'installazione: il primo riepilogo
  # viene scritto subito, per non lasciare un riquadro vuoto in attesa
  # della prima mattina. Una volta sola, non una al giorno.
